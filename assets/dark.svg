<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="100%" stop-color="#0A181F" />
    </linearGradient>
    <style>
      .term-header { fill: #94A3B8; font-family: monospace; font-size: 13px; }
      .badge-text { fill: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: bold; }
      .cyan-title { fill: #22D3EE; font-family: 'Courier New', Courier, monospace; font-size: 14px; font-weight: bold; }
      .field-label { fill: #38BDF8; font-family: 'Courier New', Courier, monospace; font-size: 13px; font-weight: 600; }
      .field-dots { fill: #1E293B; font-family: 'Courier New', Courier, monospace; font-size: 13px; }
      .field-val { fill: #F1F5F9; font-family: 'Courier New', Courier, monospace; font-size: 13px; }
      .accent-val { fill: #A78BFA; font-family: 'Courier New', Courier, monospace; font-size: 13px; }
      .green-val { fill: #34D399; font-family: 'Courier New', Courier, monospace; font-size: 13px; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="930" height="460" rx="16" fill="url(#bgGrad)" stroke="#164E63" stroke-width="1.5" />

  <!-- Terminal Top Bar -->
  <circle cx="38" cy="36" r="6" fill="#EF4444" />
  <circle cx="56" cy="36" r="6" fill="#F59E0B" />
  <circle cx="74" cy="36" r="6" fill="#10B981" />
  <text x="475" y="40" text-anchor="middle" class="term-header">profile.sh --live</text>

  <!-- Left Side Visual Box -->
  <rect x="35" y="65" width="280" height="375" rx="10" fill="#030712" stroke="#0E7490" stroke-width="1" />
  <text x="50" y="90" fill="#22D3EE" font-family="monospace" font-size="11px">VISUAL.MAP</text>
  
  <!-- Cyberpunk Particle Graphic Placeholder -->
  <g opacity="0.85">
    <ellipse cx="175" cy="240" rx="90" ry="120" fill="none" stroke="#22D3EE" stroke-width="1" stroke-dasharray="4 6" />
    <ellipse cx="175" cy="240" rx="60" ry="85" fill="none" stroke="#A78BFA" stroke-width="1" stroke-dasharray="3 5" />
    <ellipse cx="175" cy="240" rx="30" ry="50" fill="none" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="175" cy="240" r="8" fill="#22D3EE" />
  </g>
  <text x="175" y="380" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="11px">[ Secure Node Topology ]</text>

  <!-- Right Side Terminal Content Box -->
